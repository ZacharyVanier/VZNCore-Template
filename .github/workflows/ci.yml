name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rokit
        uses: CompeyDev/setup-rokit@v0.1.2

      - name: Install public development dependencies
        run: wally install

      - name: Check formatting
        run: stylua --check src tests examples bench

      - name: Lint
        run: selene src tests examples bench

      - name: Build Rojo project
        run: rojo build default.project.json -o build.rbxlx

      - name: Run specifications
        run: lune run tests/run-all.luau
